<!-- ==========================================================================
     COMPONENTE: GAMES
     Grilla de catálogo. Cada .game-card recibe su tinte vía --tint (0-360)
     inline, tal como en la versión original.
     ========================================================================== -->
<section class="games" id="games">
  <div class="container">
    <div class="games__header">
      <h2 class="games__title">Catálogo destacado</h2>
      <a href="#" class="games__see-all">Ver todo</a>
    </div>

    <div class="games__grid">

      <article class="game-card" style="--tint: 200">
        <div class="game-card__cover">
          <span class="game-card__spine"></span>
          <span class="game-card__tag">Acción</span>
          <div class="game-card__play">
            <span class="game-card__play-icon">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </div>
        </div>
        <div class="game-card__info">
          <h3>Nombre del juego</h3>
          <p>Estudio desarrollador</p>
        </div>
      </article>

      <article class="game-card" style="--tint: 20">

        </div>
