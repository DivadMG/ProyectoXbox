<!-- ==========================================================================
     COMPONENTE: HERO
     Sección principal de bienvenida: titular, subtítulo, CTAs y visual
     de la consola. Es lo primero que ve el usuario al entrar.
     ========================================================================== -->
<section class="hero" id="top">
  <div class="hero__glow" aria-hidden="true"></div>

  <div class="hero__inner container">
    <div class="hero__copy">
      <p class="hero__eyebrow">Nueva generación · Disponible ahora</p>
      <h1 class="hero__title">
        Juega más allá<br />
        de los <span class="hero__title-accent">límites</span>
      </h1>
      <p class="hero__subtitle">
        Potencia de nueva generación, tiempos de carga casi instantáneos
        y un catálogo que crece cada mes. Tu próxima partida empieza aquí.
      </p>
      <div class="hero__actions">
        <button class="btn btn--primary">Comprar consola</button>
        <button class="btn btn--ghost">Ver catálogo de juegos</button>
      </div>
    </div>

    <div class="hero__visual" aria-hidden="true">
      <div class="hero__console">
        <div class="hero__console-body"></div>
        <div class="hero__console-vent"></div>
      </div>
    </div>
  </div>

  <!-- Indicador de scroll -->
  <a href="#consolas" class="hero__scroll-hint" aria-label="Bajar a la siguiente sección">
    <span></span>
  </a>
</section>
